<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CIB Data Marketplace">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3a5b"/>
      <stop offset="100%" stop-color="#0b1c2e"/>
    </linearGradient>
    <linearGradient id="cellBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ea3d6"/>
      <stop offset="100%" stop-color="#3f74ab"/>
    </linearGradient>
  </defs>

  <!-- Dark navy tile -->
  <rect width="32" height="32" rx="8" fill="url(#tile)"/>

  <!-- Data grid mark: 3x3 grid of cells in blue, gold accent cell for the marketplace -->
  <g>
    <rect x="6.4" y="6.4" width="6" height="6" rx="1.3" fill="url(#cellBlue)"/>
    <rect x="13.4" y="6.4" width="6" height="6" rx="1.3" fill="url(#cellBlue)" opacity="0.85"/>
    <rect x="20.4" y="6.4" width="6" height="6" rx="1.3" fill="url(#cellBlue)" opacity="0.65"/>

    <rect x="6.4" y="13.4" width="6" height="6" rx="1.3" fill="url(#cellBlue)" opacity="0.85"/>
    <rect x="13.4" y="13.4" width="6" height="6" rx="1.3" fill="#e0c48a"/>
    <rect x="20.4" y="13.4" width="6" height="6" rx="1.3" fill="url(#cellBlue)" opacity="0.85"/>

    <rect x="6.4" y="20.4" width="6" height="6" rx="1.3" fill="url(#cellBlue)" opacity="0.65"/>
    <rect x="13.4" y="20.4" width="6" height="6" rx="1.3" fill="url(#cellBlue)" opacity="0.85"/>
    <rect x="20.4" y="20.4" width="6" height="6" rx="1.3" fill="url(#cellBlue)"/>
  </g>
</svg>
